name: Build static nmap

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf \
            libpcap-dev libssh2-1-dev libssl-dev zlib1g-dev \
            liblua5.4-dev libpcre2-dev

      - name: Configure
        run: |
          ./configure --with-liblua=included --with-libpcap=included

      - name: Build static binary
        run: make static -j$(nproc)

      - name: Verify it's actually static
        run: |
          file ./nmap
          ldd ./nmap || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmap-static-linux-x86_64
          path: ./nmap

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./nmap

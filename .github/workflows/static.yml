name: Build static nmap

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf \
            libssh2-1-dev libssl-dev zlib1g-dev \
            liblua5.4-dev libpcre2-dev

      - name: Remove headers that trigger unwanted static-link-breaking libpcap backends
        run: sudo apt-get remove -y libibverbs-dev libdbus-1-dev rdma-core || true

      - name: Configure
        run: |
          ./configure --with-liblua=included --with-libpcap=included

      - name: Build static binary
        run: make static -j$(nproc)

      - name: Verify it's actually static
        run: |
          file ./nmap
          ldd ./nmap || true

      - name: Extract nmap version
        id: version
        run: |
          VERSION=$(echo NMAP_VERSION | cpp -imacros nmap.h - | sed -n '$s/[" ]//g;$p')
          echo "Detected nmap version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename binary with version
        run: cp ./nmap ./nmap-${{ steps.version.outputs.version }}-static-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmap-${{ steps.version.outputs.version }}-static-linux-x86_64
          path: ./nmap-${{ steps.version.outputs.version }}-static-linux-x86_64

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: nmap ${{ steps.version.outputs.version }} (static)
          files: ./nmap-${{ steps.version.outputs.version }}-static-linux-x86_64
